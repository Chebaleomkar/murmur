name: build

on:
  workflow_dispatch:
  push:
    branches: [overlay-and-hotkeys]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: windows-x86_64
            needle_bin: needle.exe
          - os: ubuntu-latest
            engine: linux-x86_64
            needle_bin: needle
          - os: macos-latest
            engine: macos-arm64
            needle_bin: needle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name Murmur \
            --collect-submodules pynput dictate.py

      - name: Assemble bundle
        shell: bash
        run: |
          mkdir bundle
          cp -R dist/Murmur* bundle/
          cp "engines/${{ matrix.engine }}/${{ matrix.needle_bin }}" bundle/
          cp models/whistle.cact bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: murmur-${{ matrix.engine }}
          path: bundle/*
